name: validate

# Runs on every PR and every push: store.json schema + cover consistency gate
# (see tools/validate.py). Green CI is a merge prerequisite.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install jsonschema pillow

      - name: Validate catalog
        run: python3 tools/validate.py
